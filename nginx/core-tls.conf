# HTTPS 入口配置（由 docker-compose.tls.yml 挂载为 default.conf）
#
# 设计要点：
#   - 用域名访问 → 强制 301 跳转到 HTTPS
#   - 用 IP 直连（10.201.3.94:2280）→ 保持 HTTP 可用，作为兜底入口，
#     否则跳转到 https://10.201.3.94 会因证书域名不匹配而报错

# 兜底：IP 直连或任何未匹配的 Host，保持 HTTP 直接服务
server {
    listen 80 default_server;
    server_name _;
    include /etc/nginx/conf.d/locations.inc;
}

# 域名访问 HTTP → 强制跳 HTTPS
server {
    listen 80;
    server_name seuoj.best www.seuoj.best;
    return 301 https://$host$request_uri;
}

# 主入口：HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name seuoj.best www.seuoj.best;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/locations.inc;
}

# Optional machine-local vhosts; excluded from Git.
include /etc/nginx/local-vhosts/*.conf;
